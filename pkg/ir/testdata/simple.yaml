name: Simple
triggers:
  - name: Trigger1
    arguments_string: "int foo, float bar"
  - name: Trigger2
states:
  - name: StateA
    options:
      - name: "default"
    enter_reaction_triggers:
      - "Trigger1"
      - ""
    exit_reaction_triggers:
      - "Trigger1"
      - ""
  - name: StateB
    default: true
    parent: StateA
    exit_reaction_triggers:
      - "Trigger1"
  - name: StateC
    parent: StateA
    enter_reaction_triggers:
      - "Trigger1"
      - ""
transitions:
  - from: StateB
    to: StateC
    trigger: Trigger1


