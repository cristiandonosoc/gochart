name: CI release
on:
  workflow_dispatch:
  push:
    tags:
      - "v*" # Matches v0.1.0, v1.2, v.2, etc.
permissions:
  contents: write

jobs:
  create_release:
    name: Create single release for all builds
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Create a release.
        id: create_release
        uses: marvinpinto/action-automatic-releases@v1.2.1
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          draft: true
          prerelease: true
          title: Release ${{ github.ref_name }}
  build_linux:
    name: Create the linux release
    needs: create_release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        env:
          CC: gcc-13   # C++20 support.
          CXX: g++-13
        run: bazel test //...
      - name: Package build
        env:
          STABLE_GOCHART_VERSION: ${{ github.ref_name }}
          STABLE_GOCHART_GIT_COMMIT: ${{ github.sha }}
          CC: gcc-13    # C++20 support.
          CXX: g++-13
        run: bazel build --workspace_status_command="python build/build_stamp.py" --stamp //:pkg_release
      - name: Copy it to workspace root
        run: cp $(bazel cquery //:pkg_release --output=files 2>/dev/null) ${{ github.workspace }}/
      - name: Upload package
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url }}
          asset_path: ${{ github.workspace }}/pkg_release.zip
          asset_name: gochart-linux-${{ github.ref_name }}.zip
          asset_content_type: application/octet-stream
  build_windows:
    name: Create the windows release
    needs: create_release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: bazel test //...
      - name: Package build
        env:
          STABLE_GOCHART_VERSION: ${{ github.ref_name }}
          STABLE_GOCHART_GIT_COMMIT: ${{ github.sha }}
        run: bazel build --workspace_status_command="python build/build_stamp.py" --stamp //:pkg_release
      - name: Copy it to workspace root
        run: cp $(bazel cquery //:pkg_release --output=files 2>$null) ${{ github.workspace }}
      - name: Upload package
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url }}
          asset_path: ${{ github.workspace }}/pkg_release.zip
          asset_name: gochart-win64-${{ github.ref_name }}.zip
          asset_content_type: application/octet-stream
