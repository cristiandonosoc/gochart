name: pull request tests
on: [pull_request]
jobs:
  gofmt:
    name: Run gofmt
    runs-on: ubuntu-latest
    steps:
    - uses: Jerome1337/gofmt-action@v1.0.5
      with:
        gofmt-path: .
        gofmt-flags: -l -d
  linux_tests:
    runs-on: ubuntu-latest
    steps:
    - name: Load the cache
      uses: actions/cache@v3
      with:
        key: ${{ runner.os }}-bazel-cache
        path: |
          ~/.cache/bazelisk
          ~/.cache/bazel
    - uses: actions/checkout@v4
    - name: run tests
      env:
        CC: gcc-10    # C++20 support.
        CXX: g++-10
      run: bazel test //...
