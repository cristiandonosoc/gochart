  windows_tests:
    runs-on: windows-latest
    steps:
    - name: dump before env
      env:
        ENV_CONTEXT_BEFORE: ${{ toJson(env) }}
      run: write-host "$env:ENV_CONTEXT_BEFORE"
    - name: Add paths to env
      env:
        ACTIONS_ALLOW_UNSECURE_COMMANDS: true
      shell: cmd
      run: |
        echo ::set-env name=USERPROFILE::%USERPROFILE%
        echo ::set-env name=USERNAME::%USERNAME%
    - name: dump after env
      env:
        ENV_CONTEXT_AFTER: ${{ toJson(env) }}
      run: write-host "$env:ENV_CONTEXT_AFTER"
    - name: Load the cache
      uses: actions/cache@v3
      with:
        key: ${{ runner.os }}-bazel-cache
        path: |
          ${{ env.USERPROFILE }}\_bazel_${{ env.USERNAME }}
          $USERPROFILE\_bazel_$USERNAME
    - uses: actions/checkout@v4
