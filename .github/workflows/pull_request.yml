name: pull request tests
on: [pull_request]
jobs:
  # Run gofmt.
  gofmt:
    name: Run gofmt
    runs-on: ubuntu-latest
    steps:
    - uses: Jerome1337/gofmt-action@v1.0.5
      with:
        gofmt-path: .
        gofmt-flags: -l -d
