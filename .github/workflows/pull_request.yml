name: pull request tests
on: [push, pull_request]
jobs:
  gofmt:
    name: Run gofmt
    runs-on: ubuntu-latest
    steps:
    - uses: Jerome1337/gofmt-action@v1.0.5
      with:
        gofmt-path: .
        gofmt-flags: -l -d
  tests:
    name: pull request tests
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: run tests
      run: bazel test //...
