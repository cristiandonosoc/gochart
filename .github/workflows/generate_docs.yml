name: Generate Docs
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  create_docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Generate options Docs
        run: bazel run //cmd/internal/docs_generator -- ${{github.workspace}}/docs/options.md
      - name: Generate example headers.
        run: bazel run //cmd/gochart -- backend cpp generate ${{github.workspace}}/docs/example_generated/simple.gochart ${{github.workspace}}/docs/example_generated simple
      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          default_author: github_actions
          message: "Update docs for ${{github.ref_name}}"
          add: "docs/"








