name: windows tests
on: [workflow_dispatch]
jobs:
  windows_tests:
    runs-on: windows-latest
    steps:
    # By default the windows variables are not present as env that can be used to detect where the
    # bazel cache will be, so we need to run a step to add those environment variables.
    - name: Add paths to env
      env:
        # ::set-env is deprecated and should not be used anymore.
        # Sadly the proposed workaround doesn't seem to work on Windows.
        # We set this env variable to permit us to use the ::set-env command.
        #
        # See https://github.blog/changelog/2020-10-01-github-actions-deprecating-set-env-and-add-path-commands/
        ACTIONS_ALLOW_UNSECURE_COMMANDS: true
      shell: cmd
      run: |
        echo ::set-env name=USERPROFILE::%USERPROFILE%
        echo ::set-env name=USERNAME::%USERNAME%
    - name: Load the cache
      uses: actions/cache@v3
      with:
        key: ${{ runner.os }}-bazel-cache
        path: |
          ${{ env.USERPROFILE }}\_bazel_${{ env.USERNAME }}
    - uses: actions/checkout@v4
    - name: run tests
      run: bazel test //...
